name: Release (Windows)

# Build and publish a ready-to-run Windows build with no maintainer machine
# required: push a version tag (e.g. v1.8.0) and GitHub builds it on a Windows
# runner and attaches the self-contained exe to a GitHub Release.
#
#   git tag v1.8.0
#   git push origin v1.8.0
#
# You can also run it by hand from the Actions tab (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for a manual build (e.g. v1.8.0-test)"
        required: false
        default: "manual"

permissions:
  contents: write   # required to create the Release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      # Self-contained single-file build: bundles the .NET runtime, so end
      # users need nothing installed (this is what avoids the ".NET install"
      # prompt on Windows 11).
      - name: Publish self-contained (win-x64)
        run: >
          dotnet publish Trizbort.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:GenerateManifests=false -o publish/win-x64

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}"
          Compress-Archive -Path publish/win-x64/* -DestinationPath "Trizbort-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Works for both a pushed tag and a manual (workflow_dispatch) run.
          # For a draft, the git tag is not actually created until you publish
          # the release, and the Actions token creates it -- so this does not
          # depend on being able to push a tag over git.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Trizbort-*-win-x64.zip
          draft: true            # opens as a draft so you review before publishing
          generate_release_notes: true
