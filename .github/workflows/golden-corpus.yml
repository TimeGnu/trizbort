name: Golden Corpus

# One-time (manual) mint of reference exporter output from the legacy C#
# Trizbort. Builds the app on a Windows runner, drives its command-line export
# mode over every sample map x every format, and commits the results under
# qt/tests/golden/ as fixtures for the C++/Qt port. No local machine or
# Microsoft toolchain required in a developer's own loop.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mint:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Build Trizbort (self-contained)
        run: >
          dotnet publish Trizbort.csproj -c Release -r win-x64 --self-contained true
          -p:GenerateManifests=false -o app

      - name: Export every sample in every format
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'app/Trizbort.exe'
          $formats = @(
            @{ opt = '--inform6';    ext = 'inf'  },
            @{ opt = '--inform7';    ext = 'ni'   },
            @{ opt = '--tads';       ext = 't'    },
            @{ opt = '--alan';       ext = 'i'    },
            @{ opt = '--hugo';       ext = 'hug'  },
            @{ opt = '--zil';        ext = 'zil'  },
            @{ opt = '--quest';      ext = 'aslx' },
            @{ opt = '--adventuron'; ext = 'adv'  }
          )
          $samples = Get-ChildItem -Path 'samples' -Filter '*.trizbort' | Sort-Object Name
          foreach ($s in $samples) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($s.Name)
            $outDir = Join-Path 'qt/tests/golden' $base
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            foreach ($f in $formats) {
              $out = Join-Path $outDir ("$base." + $f.ext)
              Write-Host "==> $($s.Name)  $($f.opt)"
              $p = Start-Process -FilePath $exe `
                     -ArgumentList @($s.FullName, $f.opt, $out, '-x') -PassThru
              if (-not $p.WaitForExit(60000)) {
                Write-Host "    timed out; killing"
                try { $p.Kill() } catch {}
              }
            }
          }
          Write-Host "=== generated files ==="
          Get-ChildItem -Recurse -File qt/tests/golden |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Commit fixtures
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add qt/tests/golden
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "no changes to commit"
          } else {
            git commit `
              -m "Mint golden exporter corpus (all samples x all formats)" `
              -m "Generated by the legacy C# Trizbort exporters on CI as reference fixtures for the C++/Qt port. See qt/tests/golden/README.md." `
              -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
            git push origin "HEAD:${{ github.ref_name }}"
          }
